<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Verdance — Where the forest breathes</title>
<meta name="description" content="Verdance: an interactive landing page for a forest retreat at Lago di Braies, with a living hero, firefly cursor and micro-interactions.">
<meta name="theme-color" content="#08110C">
<meta property="og:type" content="website">
<meta property="og:title" content="Verdance — Where the forest breathes">
<meta property="og:description" content="Verdance: an interactive landing page for a forest retreat at Lago di Braies, with a living hero, firefly cursor and micro-interactions.">
<meta property="og:image" content="assets/img/og-image.jpg">
<meta name="twitter:card" content="summary_large_image">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%2308110C'/%3E%3Cpath d='M16 5 L23 15 H19.5 L25 24 H7 L12.5 15 H9 Z' fill='none' stroke='%23D4F06A' stroke-width='1.8' stroke-linejoin='round'/%3E%3C/svg%3E">
<link rel="preload" href="assets/fonts/instrument-serif-latin-400-normal.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="assets/fonts/manrope-latin-500-normal.woff2" as="font" type="font/woff2" crossorigin>
<style>
@font-face{font-family:'Instrument Serif';font-style:normal;font-weight:400;font-display:swap;src:url(assets/fonts/instrument-serif-latin-400-normal.woff2) format('woff2')}
@font-face{font-family:'Instrument Serif';font-style:italic;font-weight:400;font-display:swap;src:url(assets/fonts/instrument-serif-latin-400-italic.woff2) format('woff2')}
@font-face{font-family:Manrope;font-weight:400;font-display:swap;src:url(assets/fonts/manrope-latin-400-normal.woff2) format('woff2')}
@font-face{font-family:Manrope;font-weight:500;font-display:swap;src:url(assets/fonts/manrope-latin-500-normal.woff2) format('woff2')}
@font-face{font-family:Manrope;font-weight:600;font-display:swap;src:url(assets/fonts/manrope-latin-600-normal.woff2) format('woff2')}
@font-face{font-family:Manrope;font-weight:700;font-display:swap;src:url(assets/fonts/manrope-latin-700-normal.woff2) format('woff2')}
</style>
<style>
body{margin:0;background:#08110C}
html{scroll-behavior:smooth}
a{color:#F1F4EE}a:hover{color:#D4F06A}
@media (pointer:fine){.fx-page,.fx-page *{cursor:none !important}}
.fx-page{-webkit-font-smoothing:antialiased}
.fx-page ::selection{background:var(--accent);color:#08110C}

@keyframes fxIntro{0%{transform:scale(1.22);filter:blur(10px) brightness(.55)}100%{transform:scale(1);filter:blur(0) brightness(1)}}
@keyframes fxRise{0%{transform:translateY(112%) rotate(4deg)}100%{transform:translateY(0) rotate(0)}}
@keyframes fxFade{0%{opacity:0;transform:translateY(14px)}100%{opacity:1;transform:translateY(0)}}
@keyframes fxDriftA{0%{transform:translate3d(-6%,0,0)}100%{transform:translate3d(8%,-3%,0)}}
@keyframes fxDriftB{0%{transform:translate3d(6%,2%,0)}100%{transform:translate3d(-10%,-2%,0)}}
@keyframes fxBreath{0%,100%{opacity:.35}50%{opacity:.75}}
@keyframes fxGrain{0%{transform:translate(0,0)}25%{transform:translate(-3%,2%)}50%{transform:translate(2%,-3%)}75%{transform:translate(-2%,-1%)}100%{transform:translate(1%,3%)}}
@keyframes fxFly{0%{transform:translate3d(-12vw,0,0)}100%{transform:translate3d(112vw,-60px,0)}}
@keyframes fxFlap{0%,100%{transform:scaleY(1)}50%{transform:scaleY(-.55)}}
@keyframes fxPulse{0%{box-shadow:0 0 0 0 var(--accent)}70%{box-shadow:0 0 0 10px rgba(0,0,0,0)}100%{box-shadow:0 0 0 0 rgba(0,0,0,0)}}
@keyframes fxSpin{to{transform:rotate(360deg)}}
@keyframes fxScroll{0%{transform:scaleY(0);transform-origin:top}45%{transform:scaleY(1);transform-origin:top}55%{transform:scaleY(1);transform-origin:bottom}100%{transform:scaleY(0);transform-origin:bottom}}
@keyframes fxMarquee{to{transform:translate3d(-50%,0,0)}}
@keyframes fxSnow{0%{background-position:0 0,0 0,0 0}100%{background-position:40px 600px,-30px 400px,20px 300px}}
@keyframes fxPop{0%{transform:scale(.6);opacity:0}60%{transform:scale(1.08);opacity:1}100%{transform:scale(1)}}

.fx-bgimg{animation:fxIntro 2.6s cubic-bezier(.16,1,.3,1) both}
.fx-mist-a{animation:fxDriftA 38s ease-in-out infinite alternate}
.fx-mist-b{animation:fxDriftB 52s ease-in-out infinite alternate}
.fx-rays{animation:fxBreath 9s ease-in-out infinite}
.fx-grain{animation:fxGrain .9s steps(4) infinite}
.fx-bird{animation:fxFly linear infinite}
.fx-wing{transform-box:fill-box;transform-origin:center;animation:fxFlap .55s ease-in-out infinite}

.fx-word{display:inline-block;overflow:hidden;padding:0 .04em .12em;margin-bottom:-.12em;vertical-align:top}
.fx-word>span{display:inline-block;animation:fxRise 1.3s cubic-bezier(.16,1,.3,1) both;transition:transform .5s cubic-bezier(.16,1,.3,1),color .4s ease}
.fx-word:hover>span{transform:translateY(-8px) skewX(-7deg);color:var(--accent)}
.fx-in{animation:fxFade 1.1s cubic-bezier(.16,1,.3,1) both}

.fx-link{position:relative;text-decoration:none;padding:10px 2px;display:inline-block}
.fx-link::after{content:"";position:absolute;left:0;right:0;bottom:4px;height:1px;background:var(--accent);transform:scaleX(0);transform-origin:right;transition:transform .5s cubic-bezier(.16,1,.3,1)}
.fx-link:hover::after{transform:scaleX(1);transform-origin:left}
.fx-link-d::after{background:#2F5A22}

.fx-btn{position:relative;overflow:hidden;isolation:isolate;transition:color .45s ease,border-color .45s ease}
.fx-btn::before{content:"";position:absolute;inset:0;border-radius:inherit;background:#F1F4EE;transform:translateY(102%);transition:transform .55s cubic-bezier(.16,1,.3,1);z-index:-1}
.fx-btn:hover::before{transform:translateY(0)}
.fx-btn:hover{color:#08110C !important}
.fx-btn-d::before{background:#12201A}
.fx-btn-d:hover{color:#F1F4EE !important}
.fx-arrow{transition:transform .5s cubic-bezier(.16,1,.3,1)}
.fx-btn:hover .fx-arrow,.fx-row:hover .fx-arrow,.fx-stay:hover .fx-arrow{transform:translateX(5px) rotate(-45deg)}
.fx-page a:focus-visible,.fx-page button:focus-visible,.fx-page summary:focus-visible,.fx-page input:focus-visible{outline:2px solid var(--accent);outline-offset:4px}
[data-theme="light"] a:focus-visible,[data-theme="light"] button:focus-visible,[data-theme="light"] input:focus-visible{outline-color:#2F5A22}

.fx-ghost{transition:background .4s ease,border-color .4s ease}
.fx-ghost:hover{background:rgba(241,244,238,.12);border-color:rgba(241,244,238,.6) !important}
.fx-ghost .fx-play{transition:transform .5s cubic-bezier(.16,1,.3,1),background .4s ease}
.fx-ghost:hover .fx-play{transform:scale(1.15);background:var(--accent);color:#08110C}

.fx-dot-live{animation:fxPulse 2.2s ease-out infinite}
.fx-badge-ring{animation:fxSpin 22s linear infinite}
.fx-badge:hover .fx-badge-ring{animation-duration:5s}
.fx-badge .fx-badge-core{transition:transform .5s cubic-bezier(.16,1,.3,1)}
.fx-badge:hover .fx-badge-core{transform:scale(1.12) rotate(45deg)}
.fx-scroll-line{animation:fxScroll 2.4s cubic-bezier(.65,0,.35,1) infinite}

.fx-page[data-rv] .rv{opacity:0;transform:translateY(36px);transition:opacity 1.1s cubic-bezier(.16,1,.3,1),transform 1.2s cubic-bezier(.16,1,.3,1)}
.fx-page[data-rv] .rv[data-in]{opacity:1;transform:none}

.ph{position:relative;overflow:hidden;background-color:#142219;background-image:repeating-linear-gradient(135deg,rgba(241,244,238,.045) 0 1px,transparent 1px 14px);display:flex;align-items:center;justify-content:center}
.ph-l{background-color:#D6DDD0;background-image:repeating-linear-gradient(135deg,rgba(18,32,26,.06) 0 1px,transparent 1px 14px)}
.ph-cap{display:flex;flex-direction:column;align-items:center;gap:10px;text-align:center;padding:16px;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:rgba(241,244,238,.66)}
.ph-l .ph-cap{color:#45564A}
.ph-zoom{transition:transform 1.2s cubic-bezier(.16,1,.3,1)}
.fx-zoomwrap:hover .ph-zoom{transform:scale(1.06)}

.fx-card{position:relative;transition:transform .7s cubic-bezier(.16,1,.3,1),box-shadow .7s ease;transform-style:preserve-3d;will-change:transform}
.fx-card:hover{box-shadow:0 40px 80px -30px rgba(0,0,0,.7)}
.fx-card:hover .ph-zoom{transform:scale(1.07)}
.fx-glare{position:absolute;inset:0;border-radius:inherit;pointer-events:none;background:radial-gradient(420px circle at var(--gx,50%) var(--gy,50%),rgba(255,255,240,.16),rgba(255,255,240,0) 60%);opacity:var(--ga,0);transition:opacity .5s ease}
.fx-dots>span{transition:transform .4s ease}
.fx-card:hover .fx-dots>span{transform:scaleY(1.6)}

.fx-marquee{animation:fxMarquee 38s linear infinite}
.fx-band:hover .fx-marquee{animation-duration:90s}
.fx-outline{color:transparent;-webkit-text-stroke:1px rgba(241,244,238,.55)}

.fx-tab{transition:background .45s ease,color .45s ease,border-color .45s ease}
.fx-tab:hover{border-color:rgba(241,244,238,.8) !important}
.fx-season-img{transition:opacity 1.3s ease,transform 6s cubic-bezier(.16,1,.3,1)}
.fx-stay .fx-alt{opacity:0;transition:opacity .8s ease,transform 1.2s cubic-bezier(.16,1,.3,1)}
.fx-stay:hover .fx-alt{opacity:1}
.fx-season-text{transition:opacity .9s cubic-bezier(.16,1,.3,1),transform .9s cubic-bezier(.16,1,.3,1),filter .9s ease}
.fx-tint{transition:background 1.4s ease}
.fx-snow{background-image:radial-gradient(2px 2px at 20px 30px,#fff,transparent),radial-gradient(1.5px 1.5px at 120px 80px,rgba(255,255,255,.9),transparent),radial-gradient(2.5px 2.5px at 70px 160px,rgba(255,255,255,.8),transparent);background-size:180px 200px,140px 160px,220px 240px;animation:fxSnow 9s linear infinite;opacity:.85}

.fx-stay .ph-zoom{transition:transform 1.2s cubic-bezier(.16,1,.3,1)}
.fx-stay:hover .ph-zoom{transform:scale(1.06)}
.fx-stay .fx-reveal{opacity:0;transform:translateY(10px);transition:opacity .45s ease,transform .5s cubic-bezier(.16,1,.3,1)}
.fx-stay:hover .fx-reveal,.fx-stay:focus-visible .fx-reveal{opacity:1;transform:none}

.fx-row{transition:padding .6s cubic-bezier(.16,1,.3,1),color .4s ease}
.fx-row:hover{padding-left:18px !important;color:#2F5A22 !important}
.fx-row .fx-row-line{transform:scaleX(0);transform-origin:left;transition:transform .7s cubic-bezier(.16,1,.3,1)}
.fx-row:hover .fx-row-line{transform:scaleX(1)}

.fx-acc summary{list-style:none}
.fx-acc summary::-webkit-details-marker{display:none}
.fx-acc .fx-plus{transition:transform .5s cubic-bezier(.16,1,.3,1),background .4s ease,color .4s ease}
.fx-acc[open] .fx-plus{transform:rotate(45deg);background:var(--accent);color:#08110C}
.fx-acc summary:hover .fx-acc-title{color:var(--accent)}
.fx-acc-title{transition:color .4s ease}

.fx-input{transition:border-color .4s ease,background .4s ease}
.fx-input:focus{border-color:var(--accent) !important;background:rgba(8,17,12,.6) !important;outline:none}
.fx-pop{animation:fxPop .7s cubic-bezier(.16,1,.3,1) both}

.fx-letter{display:inline-block;transition:transform .6s cubic-bezier(.16,1,.3,1),color .4s ease}
.fx-letter:hover{transform:translateY(-14%) rotate(-4deg);color:var(--accent)}

@media (max-width:900px){.fx-navlinks{display:none !important}.fx-badge{display:none !important}}
@media (max-width:640px){.fx-meta{display:none !important}.fx-sound-label{display:none}.fx-scroll{display:none !important}.fx-hide-sm{display:none !important}}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}.fx-page *{animation-duration:.01ms !important;animation-iteration-count:1 !important}}
</style>
<noscript><style>.fx-page[data-rv] .rv{opacity:1;transform:none}</style></noscript>
<script src="assets/dc-runtime.js"></script>
</head>
<body>
<template id="tpl">

<div ref="{{ r.page }}" id="top" class="fx-page" style="--accent: {{accent}}; position: relative; width: 100%; overflow-x: clip; background: #08110C; color: #F1F4EE; font-family: Manrope, system-ui, sans-serif">

<!-- ============ STICKY NAV (appears after the hero) ============ -->
<div style="position: sticky; top: 0; height: 0; z-index: 30">
  <div ref="{{ r.sticky }}" style="display: flex; justify-content: center; padding: 14px 16px 0; opacity: 0; transform: translateY(-24px); pointer-events: none; transition: opacity .6s ease, transform .7s cubic-bezier(.16,1,.3,1)">
    <nav aria-label="Sticky" style="display: flex; align-items: center; gap: 22px; padding: 8px 8px 8px 20px; border-radius: 999px; background: rgba(8,17,12,.72); border: 1px solid rgba(241,244,238,.14); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px); box-shadow: 0 20px 40px -20px rgba(0,0,0,.6)">
      <a href="#top" style="font-family: 'Instrument Serif', Georgia, serif; font-size: 22px; text-decoration: none; color: #F1F4EE">Verdance</a>
      <div class="fx-navlinks" style="display: flex; gap: 22px; font-size: 13px; font-weight: 500">
        <a class="fx-link" href="#trails" style="color: #F1F4EE; padding: 6px 2px">Trails</a>
        <a class="fx-link" href="#seasons" style="color: #F1F4EE; padding: 6px 2px">Seasons</a>
        <a class="fx-link" href="#stays" style="color: #F1F4EE; padding: 6px 2px">Stays</a>
        <a class="fx-link" href="#notes" style="color: #F1F4EE; padding: 6px 2px">Field notes</a>
      </div>
      <a href="#visit" class="fx-btn" data-magnet="0.3" style="display: inline-flex; align-items: center; height: 44px; padding: 0 18px; border-radius: 999px; background: {{accent}}; color: #08110C; text-decoration: none; font-size: 13px; font-weight: 700">Plan a visit</a>
    </nav>
  </div>
</div>

<!-- ============ HERO ============ -->
<section ref="{{ r.hero }}" aria-label="Welcome" style="--mx: 50%; --my: 42%; position: relative; width: 100%; height: 100vh; min-height: 680px; overflow: hidden; background: #08110C; touch-action: pan-y">

  <div ref="{{ r.bg }}" aria-hidden="true" style="position: absolute; inset: -4%; will-change: transform">
    <img class="fx-bgimg" src="assets/img/forest.jpg" alt="" style="width: 100%; height: 100%; object-fit: cover; object-position: 50% 55%; display: block">
  </div>

  <div class="fx-rays" aria-hidden="true" style="position: absolute; inset: -20% -10% 30% 30%; background: repeating-linear-gradient(115deg, rgba(255,250,225,0) 0px, rgba(255,250,225,.09) 40px, rgba(255,250,225,0) 110px, rgba(255,250,225,0) 190px); filter: blur(18px); mix-blend-mode: screen; pointer-events: none"></div>

  <div ref="{{ r.mist }}" aria-hidden="true" style="position: absolute; inset: 0; pointer-events: none; will-change: transform">
    <div class="fx-mist-a" style="position: absolute; left: -10%; right: -10%; top: 46%; height: 32%; background: radial-gradient(40% 50% at 30% 50%, rgba(230,240,235,.42), rgba(230,240,235,0) 70%), radial-gradient(35% 45% at 75% 40%, rgba(230,240,235,.34), rgba(230,240,235,0) 70%); filter: blur(28px)"></div>
    <div class="fx-mist-b" style="position: absolute; left: -15%; right: -15%; top: 60%; height: 26%; background: radial-gradient(45% 50% at 55% 50%, rgba(220,235,228,.30), rgba(220,235,228,0) 70%), radial-gradient(30% 40% at 15% 60%, rgba(220,235,228,.26), rgba(220,235,228,0) 70%); filter: blur(36px)"></div>
  </div>

  <svg aria-hidden="true" width="100%" height="40%" style="position: absolute; left: 0; top: 8%; pointer-events: none; overflow: visible">
    <g class="fx-bird" style="animation-duration: 34s; animation-delay: 2s">
      <g transform="translate(0,120)"><path class="fx-wing" d="M0 6 Q6 0 11 6 Q16 0 22 6" fill="none" stroke="rgba(20,32,26,.75)" stroke-width="1.6" stroke-linecap="round"></path></g>
      <g transform="translate(34,104) scale(.8)"><path class="fx-wing" style="animation-delay: .2s" d="M0 6 Q6 0 11 6 Q16 0 22 6" fill="none" stroke="rgba(20,32,26,.7)" stroke-width="1.8" stroke-linecap="round"></path></g>
      <g transform="translate(22,140) scale(.65)"><path class="fx-wing" style="animation-delay: .35s" d="M0 6 Q6 0 11 6 Q16 0 22 6" fill="none" stroke="rgba(20,32,26,.65)" stroke-width="2" stroke-linecap="round"></path></g>
    </g>
    <g class="fx-bird" style="animation-duration: 46s; animation-delay: 19s">
      <g transform="translate(0,60) scale(.7)"><path class="fx-wing" style="animation-delay: .1s" d="M0 6 Q6 0 11 6 Q16 0 22 6" fill="none" stroke="rgba(20,32,26,.6)" stroke-width="2" stroke-linecap="round"></path></g>
      <g transform="translate(26,48) scale(.55)"><path class="fx-wing" style="animation-delay: .3s" d="M0 6 Q6 0 11 6 Q16 0 22 6" fill="none" stroke="rgba(20,32,26,.55)" stroke-width="2.2" stroke-linecap="round"></path></g>
    </g>
  </svg>

  <div aria-hidden="true" style="position: absolute; inset: 0; pointer-events: none; background: linear-gradient(to top, rgba(6,13,9,.88) 0%, rgba(6,13,9,.45) 34%, rgba(6,13,9,0) 62%), linear-gradient(to right, rgba(6,13,9,.55) 0%, rgba(6,13,9,0) 55%), linear-gradient(to bottom, rgba(6,13,9,.5) 0%, rgba(6,13,9,0) 18%)"></div>

  <div ref="{{ r.light }}" aria-hidden="true" style="position: absolute; inset: 0; pointer-events: none; background: radial-gradient(460px circle at var(--mx) var(--my), rgba(255,248,214,.16), rgba(255,248,214,0) 62%), radial-gradient(1100px circle at var(--mx) var(--my), rgba(6,13,9,0) 25%, rgba(6,13,9,.32) 100%); opacity: 0; transition: opacity 1.2s ease"></div>

  <canvas ref="{{ r.canvas }}" aria-hidden="true" style="position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none"></canvas>

  <sc-if value="{{ grain }}" hint-placeholder-val="{{ true }}">
    <svg class="fx-grain" aria-hidden="true" style="position: absolute; inset: -10%; width: 120%; height: 120%; opacity: .09; mix-blend-mode: overlay; pointer-events: none">
      <filter id="fxNoise"><feTurbulence type="fractalNoise" baseFrequency=".85" numOctaves="2" stitchTiles="stitch"></feTurbulence></filter>
      <rect width="100%" height="100%" filter="url(#fxNoise)"></rect>
    </svg>
  </sc-if>

  <div ref="{{ r.content }}" style="position: absolute; inset: 0; display: flex; flex-direction: column; will-change: transform">

    <header class="fx-in" style="animation-delay: .9s; display: flex; align-items: center; justify-content: space-between; gap: 24px; padding: 26px clamp(20px, 4vw, 56px)">
      <a href="#top" data-magnet="0.25" aria-label="Verdance home" style="display: flex; align-items: center; gap: 12px; text-decoration: none; color: #F1F4EE">
        <svg width="30" height="30" viewBox="0 0 32 32" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"><path d="M16 3 L24 15 H19.5 L26 25 H6 L12.5 15 H8 Z"></path><path d="M16 25 V30"></path></svg>
        <span style="font-family: 'Instrument Serif', Georgia, serif; font-size: 28px; letter-spacing: .01em; line-height: 1">Verdance</span>
      </a>
      <nav class="fx-navlinks" aria-label="Primary" style="display: flex; gap: 34px; font-size: 14px; font-weight: 500; letter-spacing: .02em">
        <a class="fx-link" href="#trails" style="color: #F1F4EE">Trails</a>
        <a class="fx-link" href="#seasons" style="color: #F1F4EE">Seasons</a>
        <a class="fx-link" href="#stays" style="color: #F1F4EE">Cabins &amp; stays</a>
        <a class="fx-link" href="#notes" style="color: #F1F4EE">Field notes</a>
      </nav>
      <div style="display: flex; align-items: center; gap: 12px">
        <button type="button" data-magnet="0.35" onClick="{{ toggleSound }}" aria-pressed="{{ soundPressed }}" aria-label="{{ soundAria }}" style="display: flex; align-items: center; gap: 10px; height: 44px; padding: 0 16px; border-radius: 999px; border: 1px solid rgba(241,244,238,.28); background: rgba(8,17,12,.35); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); color: #F1F4EE; font: 500 13px Manrope, sans-serif; letter-spacing: .02em">
          <span aria-hidden="true" style="display: flex; align-items: flex-end; gap: 2px; height: 14px">
            <sc-for list="{{ bars }}" as="b" hint-placeholder-count="4">
              <span style="width: 2px; border-radius: 2px; background: {{accent}}; height: {{ b.h }}; transition: height .3s ease"></span>
            </sc-for>
          </span>
          <span class="fx-sound-label">{{ soundLabel }}</span>
        </button>
        <a href="#visit" class="fx-btn" data-magnet="0.35" style="display: inline-flex; align-items: center; height: 44px; padding: 0 20px; border-radius: 999px; border: 1px solid rgba(241,244,238,.5); color: #F1F4EE; text-decoration: none; font-size: 13px; font-weight: 600; letter-spacing: .02em">Plan a visit</a>
      </div>
    </header>

    <div aria-hidden="true" style="position: absolute; left: 50%; top: 16%; transform: translateX(-50%); display: flex; align-items: center; gap: 10px; font-size: 12px; letter-spacing: .14em; text-transform: uppercase; color: rgba(241,244,238,.9); opacity: {{ hintOpacity }}; transition: opacity 1.4s ease; pointer-events: none; white-space: nowrap; text-shadow: 0 1px 12px rgba(0,0,0,.5)">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v4"></path><path d="M12 17v4"></path><path d="M3 12h4"></path><path d="M17 12h4"></path><circle cx="12" cy="12" r="2.5"></circle></svg>
      Move to wake the forest · click to scatter light
    </div>

    <div style="flex: 1; display: flex; flex-direction: column; justify-content: flex-end; padding: 0 clamp(20px, 4vw, 56px) clamp(28px, 5vh, 56px)">
      <div style="display: flex; align-items: flex-end; justify-content: space-between; gap: 40px; flex-wrap: wrap">
        <div style="max-width: 760px; display: flex; flex-direction: column; gap: 26px">

<script>

class Component extends DCLogic {
  state = { awake: false, sound: false, time: '', season: 1, cursorLabel: '', subscribed: false, lit: -1 };

  refsObj() {
    if (!this._refs) {
      const r = (this._refs = {});
      ['page', 'sticky', 'hero', 'bg', 'mist', 'light', 'canvas', 'content', 'manifesto', 'preview', 'ring', 'ringIn', 'label', 'dot'].forEach((k) => {
        r[k] = (el) => { this['$' + k] = el; };
      });
    }
    return this._refs;
  }

  seasonData() {
    return [
      { name: 'Spring', word: 'Thaw', months: 'Late spring', desc: 'Snowmelt fills the lake to its brim and the first flowers push through the forest floor. Trails reopen as the ice retreats.', filter: 'saturate(1.05) brightness(1.06) hue-rotate(-6deg)', tint: 'rgba(190,230,160,.35)' },
      { name: 'Summer', word: 'Glass', months: 'June – August', desc: 'Long days, wooden rowboats on emerald water, and high trails clear all the way to the summits.', filter: 'saturate(1.25) contrast(1.05)', tint: 'rgba(120,200,170,.25)' },
      { name: 'Autumn', word: 'Gold', months: 'September – October', desc: 'The larches turn amber, the crowds thin out, and morning mist lingers on the water a little longer.', filter: 'sepia(.45) saturate(1.6) hue-rotate(-28deg) brightness(.98)', tint: 'rgba(230,150,60,.45)' },
      { name: 'Winter', word: 'Still', months: 'December – March', desc: 'The lake freezes over and falls silent. Snowshoe paths wind through the hushed spruce.', filter: 'grayscale(.75) brightness(1.15) contrast(.92)', tint: 'rgba(150,190,240,.5)' }
    ];
  }

  renderVals() {
    const st = this.state || {};
    const accent = this.props.accent ?? '#D4F06A';
    const on = !!st.sound;
    if (!this._toggle) this._toggle = () => this.toggleSound();
    if (!this._picks) this._picks = [0, 1, 2, 3].map((i) => () => this.setState({ season: i }));
    if (!this._subscribe) this._subscribe = (e) => { if (e && e.preventDefault) e.preventDefault(); this.setState({ subscribed: true }); };
    if (!this._words) {
      const text = 'Some places ask nothing of you. The forest around Braies simply breathes — spruce and larch rising from the shore, mist lifting off the water, and a silence so deep you can hear the light change. We guide you into it gently, and help you leave it exactly as you found it.';
      const em = { 'breathes': 1, 'light': 1, 'found': 1 };
      this._words = text.split(' ').map((w) => ({ w, em: !!em[w.replace(/[^a-z]/gi, '').toLowerCase()] }));
    }
    const lit = st.lit;
    const words = this._words.map((x, i) => ({
      w: x.w,
      op: lit < 0 ? 1 : Math.max(0.16, Math.min(1, lit - i + 1)).toFixed(2),
      fs: x.em ? 'italic' : 'normal',
      col: x.em ? '#2F5A22' : '#12201A'
    }));
    const active = st.season ?? 1;
    const S = this.seasonData();
    const seasons = S.map((x, i) => {
      const a = i === active;
      return {
        name: x.name, word: x.word, months: x.months, desc: x.desc,
        pick: this._picks[i], pressed: a ? 'true' : 'false',
        bg: a ? '#F1F4EE' : 'rgba(8,17,12,.35)', fg: a ? '#08110C' : '#F1F4EE', border: a ? '#F1F4EE' : 'rgba(241,244,238,.35)',
        op: a ? 1 : 0, ty: a ? '0px' : (i < active ? '-30px' : '30px'), blur: a ? '0px' : '8px', vis: a ? 'visible' : 'hidden'
      };
    });
    return {
      r: this.refsObj(),
      accent,
      grain: this.props.grain ?? true,
      time: st.time || '--:--',
      hintOpacity: st.awake ? 0 : 1,
      toggleSound: this._toggle,
      soundLabel: on ? 'Sound on' : 'Sound off',
      soundAria: on ? 'Mute forest ambience' : 'Play forest ambience',
      soundPressed: on ? 'true' : 'false',
      bars: (on ? ['10px', '14px', '7px', '12px'] : ['3px', '3px', '3px', '3px']).map((h) => ({ h })),
      words,
      seasons,
      seasonImgs: [
        { src: 'assets/img/season-spring.jpg', alt: 'A narrow path through sunlit pines and bright green undergrowth', pos: '50% 60%' },
        { src: 'assets/img/season-summer2.jpg', alt: 'Sunlight falling on mossy boulders in a bright green summer forest', pos: '55% 50%' },
        { src: 'assets/img/season-autumn.jpg', alt: 'Golden autumn trees above a sea of morning mist', pos: '50% 65%' },
        { src: 'assets/img/season-winter.jpg', alt: 'A snow-covered jetty on a frozen lake lined with snowy trees', pos: '50% 50%' }
      ].map((x, i) => ({ ...x, op: i === active ? 1 : 0, sc: i === active ? 1 : 1.08 })),
      isWinter: active === 3,
      cursorLabel: st.cursorLabel || '',
      subscribe: this._subscribe,
      subscribed: !!st.subscribed,
      notSubscribed: !st.subscribed,
      principles: [
        { n: '01', title: 'Plan ahead and prepare', desc: 'Check conditions and closures before you set out, carry what you need, and pick a route that suits the day and your group.' },
        { n: '02', title: 'Travel on durable surfaces', desc: 'Stay on marked trails and rock, even when they are muddy. Shortcuts across meadows and shoreline wear them away for good.' },
        { n: '03', title: 'Dispose of waste properly', desc: 'Pack out everything you bring in, including food scraps. Use the facilities at the lake and keep soap out of the water.' },
        { n: '04', title: 'Leave what you find', desc: 'Flowers, stones and pine cones belong here. Take photographs and leave the forest exactly as you met it.' },
        { n: '05', title: 'Minimise campfire impacts', desc: 'Light fires only where they are allowed, keep them small, and use a stove when you can.' },
        { n: '06', title: 'Respect wildlife', desc: 'Watch marmots, chamois and birds from a distance, never feed them, and keep dogs close.' },
        { n: '07', title: 'Be considerate of others', desc: 'Keep voices low, give way on narrow paths, and let the quiet be part of everyone’s visit.' }
      ]
    };
  }

  /* ---------- lifecycle ---------- */
  componentDidMount() {
    const page = this.$page;
    if (!page) return;
    this.reduce = !!(window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches);
    this.fine = window.matchMedia ? matchMedia('(pointer: fine)').matches : true;
    this.s = {
      cx: -1, cy: -1, has: false, px: 0, py: 0, crx: 0, cry: 0, pageIn: false,
      mx: 0, my: 0, vx: 0, vy: 0, speed: 0, inside: false, down: false,
      sx: 0, sy: 0, lx: 0, ly: 0, rs: 1, w: 1, h: 1, hover: null, hoverOn: false, lightBg: false, heroVis: true,
      pv: -1, pvShown: -1, pvx: 0, pvy: 0, pvo: 0,
      flies: [], spores: [], sparks: [], leaves: [], ripples: [], lastRipple: 0, last: performance.now()
    };
    this.magnets = Array.from(page.querySelectorAll('[data-magnet]'));
    this.magnets.forEach((el) => { el._mx = 0; el._my = 0; });
    this.wordEls = this.$manifesto ? Array.from(this.$manifesto.querySelectorAll('[data-w]')) : [];
    this.pvEls = this.$preview ? Array.from(this.$preview.querySelectorAll('[data-pv]')) : [];

    this.onMove = (e) => this.handleMove(e);
    this.onLeave = () => { this.s.pageIn = false; this.s.inside = false; this.s.hover = null; this.s.pv = -1; this.setTilt(null); };
    this.onDown = (e) => { this.handleMove(e); this.s.down = true; if (this.s.inside) this.burst(this.s.mx, this.s.my); };
    this.onUp = () => { this.s.down = false; };
    this.onScroll = () => { if (!this._sq) { this._sq = true; requestAnimationFrame(() => { this._sq = false; this.handleScroll(); }); } };
    page.addEventListener('pointermove', this.onMove, { passive: true });
    page.addEventListener('pointerdown', this.onDown, { passive: true });
    page.addEventListener('pointerleave', this.onLeave);
    window.addEventListener('pointerup', this.onUp);
    document.addEventListener('scroll', this.onScroll, { passive: true, capture: true });
    window.addEventListener('resize', this.onScroll);

    this.resize();
    if (window.ResizeObserver && this.$hero) { this.ro = new ResizeObserver(() => this.resize()); this.ro.observe(this.$hero); }

    /* scroll reveals */
    const rv = Array.from(page.querySelectorAll('.rv'));
    if (!this.reduce && 'IntersectionObserver' in window) {
      page.setAttribute('data-rv', '');
      this.io = new IntersectionObserver((entries) => {
        entries.forEach((en) => { if (en.isIntersecting) { en.target.setAttribute('data-in', ''); this.io.unobserve(en.target); } });
      }, { threshold: 0.12, rootMargin: '0px 0px -6% 0px' });
      rv.forEach((el) => this.io.observe(el));
    }

    this.s.sx = this.s.lx = this.s.w / 2;
    this.s.sy = this.s.ly = this.s.h * 0.42;
    this.seed();
    this.handleScroll();

    this.tick = (t) => { this.frame(t); this.raf = requestAnimationFrame(this.tick); };
    this.raf = requestAnimationFrame(this.tick);
    this.clock();
    this.clockId = setInterval(() => this.clock(), 1000);
    setTimeout(() => { if (this.$light) this.$light.style.opacity = '1'; }, 900);
  }

  componentWillUnmount() {
    cancelAnimationFrame(this.raf);
    clearInterval(this.clockId);
    const page = this.$page;
    if (page) {
      page.removeEventListener('pointermove', this.onMove);
      page.removeEventListener('pointerdown', this.onDown);
      page.removeEventListener('pointerleave', this.onLeave);
    }
    window.removeEventListener('pointerup', this.onUp);
    document.removeEventListener('scroll', this.onScroll, { capture: true });
    window.removeEventListener('resize', this.onScroll);
    if (this.ro) this.ro.disconnect();
    if (this.io) this.io.disconnect();
    if (this.audio) { clearTimeout(this.audio.birdT); try { this.audio.ctx.close(); } catch (e) {} }
  }

  clock() {
    let time = '';
    try {
      time = new Intl.DateTimeFormat('en-GB', { hour: '2-digit', minute: '2-digit', second: '2-digit', timeZone: 'Europe/Rome' }).format(new Date());
    } catch (e) { time = new Date().toLocaleTimeString(); }
    if (time !== this.state.time) this.setState({ time });
  }

  resize() {
    const hero = this.$hero, cv = this.$canvas;
    if (!hero || !cv) return;
    const r = hero.getBoundingClientRect();
    const w = Math.max(1, hero.clientWidth || r.width), h = Math.max(1, hero.clientHeight || r.height);
    this.scale = r.width / w || 1;
    const dpr = Math.min(2, window.devicePixelRatio || 1);
    cv.width = Math.round(w * dpr); cv.height = Math.round(h * dpr);
    this.ctx = cv.getContext('2d');
    this.ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    const ow = this.s.w, oh = this.s.h;
    this.s.w = w; this.s.h = h;
    this.s.flies.forEach((f) => { f.x = (f.x / ow) * w; f.y = (f.y / oh) * h; });
  }

  /* map stored client coords into page + hero coordinates */
  locate() {
    const s = this.s, page = this.$page, hero = this.$hero;
    if (!page || !s.has) return;
    const pr = page.getBoundingClientRect();
    const k = pr.width / (page.offsetWidth || pr.width) || 1;
    this.scale = k;
    s.px = (s.cx - pr.left) / k; s.py = (s.cy - pr.top) / k;
    if (hero) {
      const hr = hero.getBoundingClientRect();
      s.mx = (s.cx - hr.left) / k; s.my = (s.cy - hr.top) / k;
      s.inside = s.pageIn && s.mx >= 0 && s.my >= 0 && s.mx <= s.w && s.my <= s.h;
    }
  }

  handleScroll() {
    const s = this.s;
    if (!s) return;
    this.locate();
    const vh = window.innerHeight || 800;
    if (this.$hero) {
      const hr = this.$hero.getBoundingClientRect();
      s.heroVis = hr.bottom > 0;
      const past = hr.bottom < 90;
      if (this.$sticky && past !== this._stickyOn) {
        this._stickyOn = past;
        this.$sticky.style.opacity = past ? '1' : '0';
        this.$sticky.style.transform = past ? 'none' : 'translateY(-24px)';
        this.$sticky.style.pointerEvents = past ? 'auto' : 'none';
      }
    }
    if (this.$manifesto && this.wordEls.length && !this.reduce) {
      const r = this.$manifesto.getBoundingClientRect();
      const p = Math.max(0, Math.min(1, (vh * 0.82 - r.top) / (Math.min(r.height, vh) * 0.75)));
      const lit = Math.round(p * (this.wordEls.length + 2) * 10) / 10;
      if (lit !== this.state.lit) this.setState({ lit });
    }
  }

  /* ---------- helpers ---------- */
  rgb(hex) {
    const m = String(hex || '').replace('#', '');
    const v = m.length === 3 ? m.split('').map((c) => c + c).join('') : m.padEnd(6, '0');
    const n = parseInt(v.slice(0, 6), 16) || 0;
    return [(n >> 16) & 255, (n >> 8) & 255, n & 255];
  }

  sprite() {
    const accent = this.props.accent ?? '#D4F06A';
    if (this._spr && this._sprKey === accent) return this._spr;
    const [r, g, b] = this.rgb(accent);
    const c = document.createElement('canvas');
    c.width = c.height = 64;
    const x = c.getContext('2d');
    const gr = x.createRadialGradient(32, 32, 0, 32, 32, 32);
    gr.addColorStop(0, 'rgba(255,255,240,1)');
    gr.addColorStop(0.14, 'rgba(' + r + ',' + g + ',' + b + ',.95)');
    gr.addColorStop(0.4, 'rgba(' + r + ',' + g + ',' + b + ',.28)');
    gr.addColorStop(1, 'rgba(' + r + ',' + g + ',' + b + ',0)');
    x.fillStyle = gr; x.fillRect(0, 0, 64, 64);
    this._spr = c; this._sprKey = accent;
    return c;
  }

  seed() {
    let n = this.props.fireflies ?? 56;
    if (this.reduce) n = Math.min(n, 18);
    this._seedN = this.props.fireflies ?? 56;
    const s = this.s, arr = [];
    for (let i = 0; i < n; i++) {
      arr.push({
        x: Math.random() * s.w, y: s.h * (0.25 + Math.random() * 0.75),
        vx: 0, vy: 0, a: Math.random() * Math.PI * 2, ph: Math.random() * 10,
        sp: 0.6 + Math.random() * 1.2, r: 0.6 + Math.random() * 1.1, near: 0
      });
    }
    s.flies = arr;
  }

  setTilt(el, e) {
    if (this.tiltEl && this.tiltEl !== el) {
      const o = this.tiltEl;
      o.style.transform = '';
      o.style.setProperty('--ga', '0');
    }
    this.tiltEl = el;
    if (!el || !e || this.reduce) return;
    const r = el.getBoundingClientRect();
    const px = (e.clientX - r.left) / r.width, py = (e.clientY - r.top) / r.height;
    el.style.transform = 'perspective(1000px) rotateX(' + ((0.5 - py) * 9).toFixed(2) + 'deg) rotateY(' + ((px - 0.5) * 11).toFixed(2) + 'deg) translateY(-6px)';
    el.style.setProperty('--gx', (px * 100).toFixed(1) + '%');
    el.style.setProperty('--gy', (py * 100).toFixed(1) + '%');
    el.style.setProperty('--ga', '1');
  }

  handleMove(e) {
    const s = this.s;
    if (!s) return;
    const prevX = s.mx, prevY = s.my, had = s.has;
    s.cx = e.clientX; s.cy = e.clientY; s.has = true; s.pageIn = true;
    this.locate();
    if (!had) { s.crx = s.px; s.cry = s.py; }
    s.vx = had ? s.mx - prevX : 0; s.vy = had ? s.my - prevY : 0;
    const sp = Math.hypot(s.vx, s.vy);
    s.speed = Math.max(s.speed * 0.6, sp);

    const t = e.target && e.target.closest ? e.target : null;
    s.hover = t ? t.closest('a, button, summary, input, [data-magnet]') : null;
    s.lightBg = !!(t && t.closest('[data-theme="light"]'));
    const lab = t ? t.closest('[data-cursor]') : null;
    const label = lab ? lab.getAttribute('data-cursor') : '';
    s.labelOn = !!label;
    if (label && label !== this.state.cursorLabel) this.setState({ cursorLabel: label });
    const row = t ? t.closest('[data-preview]') : null;
    s.pv = row ? parseInt(row.getAttribute('data-preview'), 10) : -1;
    this.setTilt(t ? t.closest('[data-tilt]') : null, e);

    if (s.inside && e.pointerType !== 'touch' && !this.reduce) {
      const x = s.mx, y = s.my;
      const count = Math.min(5, Math.floor(sp / 7));
      for (let i = 0; i < count; i++) {
        s.spores.push({ x: x + (Math.random() - 0.5) * 6, y: y + (Math.random() - 0.5) * 6,
          vx: (Math.random() - 0.5) * 0.8 - s.vx * 0.04, vy: -Math.random() * 0.7 - s.vy * 0.04,
          life: 1, d: 0.012 + Math.random() * 0.02, r: 6 + Math.random() * 10 });
      }
      const now = performance.now();
      if (y > s.h * 0.72 && sp > 2 && now - s.lastRipple > 110) {
        s.lastRipple = now;
        s.ripples.push({ x, y, r: 2, life: 0.8, water: true, grow: 0.9 + Math.random() * 0.5 });
      }
    }
    if (!this.state.awake && s.inside) this.setState({ awake: true });
  }

  burst(x, y) {
    const s = this.s;
    const water = y > s.h * 0.72;
    for (let i = 0; i < 26; i++) {
      const a = Math.random() * Math.PI * 2, v = 1.5 + Math.random() * 5;
      s.sparks.push({ x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v - 1, life: 1, d: 0.014 + Math.random() * 0.018, r: 8 + Math.random() * 14 });
    }
    if (!water) {
      for (let i = 0; i < 7; i++) {
        const a = -Math.PI / 2 + (Math.random() - 0.5) * 2.4, v = 2 + Math.random() * 4;
        s.leaves.push({ x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v, rot: Math.random() * 6.28, vr: (Math.random() - 0.5) * 0.2,
          ph: Math.random() * 6.28, life: 1, size: 7 + Math.random() * 7, hue: 85 + Math.random() * 40, light: 32 + Math.random() * 22 });
      }
    }
    s.ripples.push({ x, y, r: 4, life: 1, water, grow: water ? 2.4 : 3.2 });
    if (water) s.ripples.push({ x, y, r: 1, life: 1.1, water, grow: 1.6 });
    s.flies.forEach((f) => {
      const dx = f.x - x, dy = f.y - y, d = Math.hypot(dx, dy) || 1;
      if (d < 260) { const p = (1 - d / 260) * 9; f.vx += (dx / d) * p; f.vy += (dy / d) * p; }
    });
    if (this.audio && this.state.sound) this.chirp(0.6);
  }

  /* ---------- frame ---------- */
  frame(t) {
    const s = this.s;
    if (!s) return;
    const dt = Math.min(3, (t - s.last) / 16.67 || 1);
    s.last = t;
    if ((this.props.fireflies ?? 56) !== this._seedN) this.seed();
    const I = this.props.intensity ?? 1;
    const [ar, ag, ab] = this.rgb(this.props.accent ?? '#D4F06A');

    /* hero parallax + light */
    if (s.heroVis) {
      const tx = s.inside ? s.mx : s.w / 2 + Math.sin(t * 0.0003) * s.w * 0.08;
      const ty = s.inside ? s.my : s.h * 0.42 + Math.cos(t * 0.00025) * s.h * 0.05;
      s.sx += (tx - s.sx) * 0.06 * dt; s.sy += (ty - s.sy) * 0.06 * dt;
      s.lx += (tx - s.lx) * 0.14 * dt; s.ly += (ty - s.ly) * 0.14 * dt;
      const nx = (s.sx / s.w - 0.5) * 2, ny = (s.sy / s.h - 0.5) * 2;
      if (!this.reduce) {
        if (this.$bg) this.$bg.style.transform = 'translate3d(' + (-nx * 22).toFixed(2) + 'px,' + (-ny * 14).toFixed(2) + 'px,0) scale(1.06)';
        if (this.$mist) this.$mist.style.transform = 'translate3d(' + (-nx * 46).toFixed(2) + 'px,' + (-ny * 18).toFixed(2) + 'px,0)';
        if (this.$content) this.$content.style.transform = 'translate3d(' + (nx * 7).toFixed(2) + 'px,' + (ny * 5).toFixed(2) + 'px,0)';
      }
      if (this.$hero) {
        this.$hero.style.setProperty('--mx', s.lx.toFixed(1) + 'px');
        this.$hero.style.setProperty('--my', s.ly.toFixed(1) + 'px');
      }
    }
    s.speed *= 0.9;

    /* cursor */
    s.crx += (s.px - s.crx) * 0.2 * dt; s.cry += (s.py - s.cry) * 0.2 * dt;
    const show = s.pageIn && s.has && this.fine;
    const hov = !!s.hover;
    const big = s.labelOn ? 2.4 : hov ? 1.9 : s.down ? 0.65 : 1;
    s.rs += (big - s.rs) * 0.18 * dt;
    const ang = Math.atan2(s.vy, s.vx);
    const stretch = hov ? 1 : 1 + Math.min(s.speed, 60) / 140;
    if (this.$ring) {
      this.$ring.style.opacity = show ? '1' : '0';
      this.$ring.style.transform = 'translate3d(' + s.crx.toFixed(1) + 'px,' + s.cry.toFixed(1) + 'px,0) rotate(' + ang.toFixed(3) + 'rad) scale(' + (s.rs * stretch).toFixed(3) + ',' + (s.rs / stretch).toFixed(3) + ')';
    }
    if (this.$label) {
      this.$label.style.opacity = show && s.labelOn ? '1' : '0';
      this.$label.style.transform = 'translate3d(' + s.crx.toFixed(1) + 'px,' + s.cry.toFixed(1) + 'px,0)';
    }
    if (this.$dot) {
      this.$dot.style.opacity = show && !hov ? '1' : '0';
      this.$dot.style.transform = 'translate3d(' + s.px.toFixed(1) + 'px,' + s.py.toFixed(1) + 'px,0)';
    }
    const key = (s.labelOn ? 'L' : hov ? 'H' : 'N') + (s.lightBg ? 'l' : 'd') + ar + ag + ab;
    if (key !== this._cursorKey) {
      this._cursorKey = key;
      const acc = 'rgba(' + ar + ',' + ag + ',' + ab + ',';
      const dark = s.lightBg;
      if (this.$ringIn) {
        this.$ringIn.style.background = s.labelOn ? (dark ? '#12201A' : acc + '1)') : hov ? (dark ? 'rgba(18,32,26,.08)' : acc + '.16)') : 'transparent';
        this.$ringIn.style.borderColor = s.labelOn ? (dark ? '#12201A' : acc + '1)') : hov ? (dark ? '#12201A' : acc + '.9)') : (dark ? 'rgba(18,32,26,.75)' : 'rgba(241,244,238,.85)');
      }
      if (this.$label) this.$label.style.color = dark ? '#F1F4EE' : '#08110C';
      if (this.$dot) {
        this.$dot.style.background = dark ? '#12201A' : acc + '1)';
        this.$dot.style.boxShadow = dark ? 'none' : '0 0 12px 2px ' + acc + '1)';
      }
    }

    /* floating preview for field notes */
    if (this.$preview) {
      const want = s.pv >= 0 && s.pageIn ? 1 : 0;
      s.pvo += (want - s.pvo) * 0.14 * dt;
      s.pvx += (s.px + 180 - s.pvx) * 0.12 * dt; s.pvy += (s.py - s.pvy) * 0.12 * dt;
      if (s.pv >= 0 && s.pv !== s.pvShown) {
        s.pvShown = s.pv;
        this.pvEls.forEach((el) => { el.style.opacity = String(+el.getAttribute('data-pv') === s.pv ? 1 : 0); el.style.transition = 'opacity .35s ease'; });
      }
      const rot = Math.max(-10, Math.min(10, s.vx * 0.4));
      this.$preview.style.opacity = s.pvo.toFixed(3);
      this.$preview.style.transform = 'translate3d(' + s.pvx.toFixed(1) + 'px,' + s.pvy.toFixed(1) + 'px,0) rotate(' + rot.toFixed(2) + 'deg) scale(' + (0.85 + s.pvo * 0.15).toFixed(3) + ')';
    }

    /* magnetic elements */
    if (!this.reduce && this.$page) {
      const pr = this.$page.getBoundingClientRect();
      const k = this.scale || 1;
      const vh = window.innerHeight || 2000;
      this.magnets.forEach((el) => {
        if (!el._mx && !el._my && !s.pageIn) return;
        const rc = el.getBoundingClientRect();
        if (rc.bottom < -50 || rc.top > vh + 50) return;
        const cx = (rc.left - pr.left) / k + rc.width / (2 * k) - el._mx;
        const cy = (rc.top - pr.top) / k + rc.height / (2 * k) - el._my;
        const dx = s.px - cx, dy = s.py - cy, d = Math.hypot(dx, dy);
        const R = Math.max(rc.width, rc.height) / k * 0.5 + 60;
        const str = parseFloat(el.getAttribute('data-magnet')) || 0.3;
        let gx = 0, gy = 0;
        if (s.pageIn && d < R) { const p = 1 - d / R; gx = dx * str * p; gy = dy * str * p; }
        el._mx += (gx - el._mx) * 0.16 * dt; el._my += (gy - el._my) * 0.16 * dt;
        if (Math.abs(el._mx) < 0.05 && Math.abs(el._my) < 0.05 && gx === 0) { el._mx = 0; el._my = 0; el.style.translate = ''; }
        else el.style.translate = el._mx.toFixed(2) + 'px ' + el._my.toFixed(2) + 'px';
      });
    }

    if (s.heroVis && this.ctx) this.draw(t, dt, I);
  }

  draw(t, dt, I) {
    const s = this.s, ctx = this.ctx, spr = this.sprite();
    ctx.clearRect(0, 0, s.w, s.h);
    ctx.globalCompositeOperation = 'lighter';

    const fast = s.speed > 24;
    for (const f of s.flies) {
      f.a += (Math.random() - 0.5) * 0.28 * dt;
      f.vx += Math.cos(f.a) * 0.03 * dt;
      f.vy += Math.sin(f.a) * 0.026 * dt - 0.003 * dt;
      let near = 0;
      if (s.inside) {
        const dx = s.mx - f.x, dy = s.my - f.y, d = Math.hypot(dx, dy) || 1;
        if (d < 210) {
          const p = 1 - d / 210;
          near = p;
          if (fast) { f.vx -= (dx / d) * 0.7 * p * dt; f.vy -= (dy / d) * 0.7 * p * dt; }
          else {
            f.vx += ((dx / d) * 0.035 - (dy / d) * 0.05) * p * dt;
            f.vy += ((dy / d) * 0.035 + (dx / d) * 0.05) * p * dt;
          }
        }
      }
      f.near += (near - f.near) * 0.08 * dt;
      const damp = Math.pow(0.962, dt);
      f.vx *= damp; f.vy *= damp;
      f.x += f.vx * dt; f.y += f.vy * dt;
      const m = 30;
      if (f.x < -m) f.x = s.w + m; else if (f.x > s.w + m) f.x = -m;
      if (f.y < s.h * 0.12) f.vy += 0.03 * dt;
      if (f.y > s.h + m) f.y = s.h * 0.3; else if (f.y < -m) f.y = s.h + m;
      const pulse = 0.25 + 0.75 * Math.pow(Math.sin(t * 0.0011 * f.sp + f.ph) * 0.5 + 0.5, 3);
      const glow = Math.min(1, (pulse * (0.6 + 0.4 * f.near) + f.near * 0.45) * I);
      const size = f.r * (14 + 12 * f.near);
      ctx.globalAlpha = glow;
      ctx.drawImage(spr, f.x - size / 2, f.y - size / 2, size, size);
    }

    for (let i = s.spores.length - 1; i >= 0; i--) {
      const p = s.spores[i];
      p.x += p.vx * dt; p.y += p.vy * dt; p.vy -= 0.008 * dt; p.vx *= 0.99;
      p.life -= p.d * dt;
      if (p.life <= 0) { s.spores.splice(i, 1); continue; }
      const sz = p.r * (0.4 + p.life * 0.6);
      ctx.globalAlpha = Math.min(1, p.life * 0.85 * I);
      ctx.drawImage(spr, p.x - sz / 2, p.y - sz / 2, sz, sz);
    }
    if (s.spores.length > 260) s.spores.splice(0, s.spores.length - 260);

    for (let i = s.sparks.length - 1; i >= 0; i--) {
      const p = s.sparks[i];
      p.x += p.vx * dt; p.y += p.vy * dt;
      p.vx *= Math.pow(0.95, dt); p.vy = p.vy * Math.pow(0.95, dt) + 0.03 * dt;
      p.life -= p.d * dt;
      if (p.life <= 0) { s.sparks.splice(i, 1); continue; }
      const sz = p.r * p.life;
      ctx.globalAlpha = Math.min(1, p.life * I);
      ctx.drawImage(spr, p.x - sz / 2, p.y - sz / 2, sz, sz);
    }

    ctx.globalCompositeOperation = 'source-over';

    for (let i = s.ripples.length - 1; i >= 0; i--) {
      const r = s.ripples[i];
      r.r += r.grow * dt; r.life -= (r.water ? 0.013 : 0.022) * dt;
      if (r.life <= 0) { s.ripples.splice(i, 1); continue; }
      ctx.globalAlpha = Math.max(0, r.life) * 0.55;
      ctx.lineWidth = r.water ? 1.1 : 1.4;
      ctx.strokeStyle = 'rgba(235,245,240,1)';
      ctx.beginPath();
      if (r.water) {
        ctx.ellipse(r.x, r.y, r.r, r.r * 0.28, 0, 0, Math.PI * 2);
        if (r.r > 14) { ctx.moveTo(r.x + r.r * 0.62, r.y); ctx.ellipse(r.x, r.y, r.r * 0.62, r.r * 0.62 * 0.28, 0, 0, Math.PI * 2); }
      } else {
        ctx.arc(r.x, r.y, r.r, 0, Math.PI * 2);
      }
      ctx.stroke();
    }

    for (let i = s.leaves.length - 1; i >= 0; i--) {
      const l = s.leaves[i];
      l.vy = Math.min(1.4, l.vy + 0.06 * dt);
      l.vx *= Math.pow(0.97, dt);
      l.x += (l.vx + Math.sin(t * 0.003 + l.ph) * 0.7) * dt; l.y += l.vy * dt;
      l.rot += l.vr * dt + Math.sin(t * 0.004 + l.ph) * 0.02;
      l.life -= 0.006 * dt;
      if (l.life <= 0 || l.y > s.h + 20) { s.leaves.splice(i, 1); continue; }
      ctx.save();
      ctx.translate(l.x, l.y); ctx.rotate(l.rot);
      ctx.scale(1, 0.55 + 0.45 * Math.abs(Math.sin(t * 0.005 + l.ph)));
      ctx.globalAlpha = Math.min(1, l.life * 1.4);
      ctx.fillStyle = 'hsl(' + l.hue + ',55%,' + l.light + '%)';
      const z = l.size;
      ctx.beginPath();
      ctx.moveTo(-z, 0);
      ctx.quadraticCurveTo(0, -z * 0.7, z, 0);
      ctx.quadraticCurveTo(0, z * 0.7, -z, 0);
      ctx.fill();
      ctx.strokeStyle = 'rgba(10,25,15,.35)'; ctx.lineWidth = 0.8;
      ctx.beginPath(); ctx.moveTo(-z * 0.9, 0); ctx.lineTo(z * 0.9, 0); ctx.stroke();
      ctx.restore();
    }
    ctx.globalAlpha = 1;
  }

  /* ---------- ambient sound (generated, no files) ---------- */
  toggleSound() {
    const on = !this.state.sound;
    if (on && !this.audio) {
      const AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return;
      const ctx = new AC();
      const len = ctx.sampleRate * 4, buf = ctx.createBuffer(1, len, ctx.sampleRate), d = buf.getChannelData(0);
      let last = 0;
      for (let i = 0; i < len; i++) { const w = Math.random() * 2 - 1; last = (last + 0.02 * w) / 1.02; d[i] = last * 3.2; }
      const src = ctx.createBufferSource(); src.buffer = buf; src.loop = true;
      const lp = ctx.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 520; lp.Q.value = 0.6;
      const lfo = ctx.createOscillator(); lfo.frequency.value = 0.07;
      const lfoGain = ctx.createGain(); lfoGain.gain.value = 260;
      lfo.connect(lfoGain); lfoGain.connect(lp.frequency);
      const master = ctx.createGain(); master.gain.value = 0.0001;
      src.connect(lp); lp.connect(master); master.connect(ctx.destination);
      src.start(); lfo.start();
      this.audio = { ctx, master, birdT: 0 };
    }
    const a = this.audio;
    if (!a) return;
    const now = a.ctx.currentTime;
    a.master.gain.cancelScheduledValues(now);
    a.master.gain.setValueAtTime(Math.max(0.0001, a.master.gain.value), now);
    if (on) {
      a.ctx.resume();
      a.master.gain.exponentialRampToValueAtTime(0.55, now + 1.6);
      this.scheduleBirds();
    } else {
      a.master.gain.exponentialRampToValueAtTime(0.0001, now + 0.8);
      clearTimeout(a.birdT);
    }
    this.setState({ sound: on });
  }

  scheduleBirds() {
    const a = this.audio;
    if (!a) return;
    clearTimeout(a.birdT);
    a.birdT = setTimeout(() => {
      if (!this.state.sound) return;
      this.chirp(0.35 + Math.random() * 0.3);
      this.scheduleBirds();
    }, 2500 + Math.random() * 6000);
  }

  chirp(vol) {
    const a = this.audio;
    if (!a) return;
    const ctx = a.ctx, base = 2200 + Math.random() * 1600, n = 2 + Math.floor(Math.random() * 3);
    const pan = ctx.createStereoPanner ? ctx.createStereoPanner() : null;
    const out = ctx.createGain(); out.gain.value = vol * 0.12;
    if (pan) { pan.pan.value = Math.random() * 1.6 - 0.8; out.connect(pan); pan.connect(ctx.destination); }
    else out.connect(ctx.destination);
    for (let i = 0; i < n; i++) {
      const t0 = ctx.currentTime + 0.05 + i * (0.11 + Math.random() * 0.05);
      const o = ctx.createOscillator(), g = ctx.createGain();
      o.type = 'sine';
      o.frequency.setValueAtTime(base, t0);
      o.frequency.exponentialRampToValueAtTime(base * (1.25 + Math.random() * 0.3), t0 + 0.04);
      o.frequency.exponentialRampToValueAtTime(base * 0.9, t0 + 0.09);
      g.gain.setValueAtTime(0.0001, t0);
      g.gain.exponentialRampToValueAtTime(1, t0 + 0.012);
      g.gain.exponentialRampToValueAtTime(0.0001, t0 + 0.1);
      o.connect(g); g.connect(out);
      o.start(t0); o.stop(t0 + 0.12);
    }
  }
}

(function () {
  const inst = new Component();
  inst.props = { accent: '#D4F06A', fireflies: 56, intensity: 1, grain: true };
  window.__mount(inst, document.getElementById('tpl'), document.getElementById('root'));
})();
</script>
